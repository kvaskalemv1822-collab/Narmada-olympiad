<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NVMSO - Question Bank Manager</title>
  <link rel="stylesheet" href="central.css?v=2">
</head>
<body style="background: #0b0f19; padding: 15px;">

<!-- MAIN QUESTION MANAGER CONTAINER (Direct Open) -->
<div id="question-main-container" class="container" style="display: block !important;">
  <h1>📚 Exam Question Bank Manager</h1>
  <div class="director-title" style="margin-bottom: 20px;">
    <a href="central.html" style="color: #38bdf8; text-decoration: none; font-weight: bold;">⬅ Back to Central Command Panel</a>
  </div>

  <div class="control-box" style="border: 1px solid #c084fc; background: rgba(15, 23, 42, 0.85); padding: 20px; border-radius: 12px;">
    <h3 style="color:#c084fc; margin-bottom: 15px;">➕ Add New Exam Question</h3>
    
    <div class="setting-card" style="border: 1px dashed #c084fc; padding: 15px; border-radius: 10px;">
      <div class="grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
          <label style="color: #cbd5e1; font-weight: 600; font-size: 13px; margin-bottom: 6px; display: block;">Select Target Class Range:</label>
          <select id="q-class-select" style="width: 100%; padding: 10px; border-radius: 8px; background: #020617; color: #fff; border: 1px solid #475569;">
            <option value="3-5">Class 3rd to 5th (Set 1)</option>
            <option value="6-8" selected>Class 6th to 8th (Set 2)</option>
            <option value="9-12">Class 9th to 12th (Set 3)</option>
          </select>
        </div>
        <div>
          <label style="color: #cbd5e1; font-weight: 600; font-size: 13px; margin-bottom: 6px; display: block;">Subject:</label>
          <select id="q-subject-select" style="width: 100%; padding: 10px; border-radius: 8px; background: #020617; color: #fff; border: 1px solid #475569;">
            <option value="Maths">Mathematics</option>
            <option value="Science">Science</option>
            <option value="GK">General Knowledge / Reasoning</option>
          </select>
        </div>
      </div>

      <div style="margin-top: 15px;">
        <label style="color: #cbd5e1; font-weight: 600; font-size: 13px; margin-bottom: 6px; display: block;">Question Statement (Hindi/English):</label>
        <textarea id="q-text" rows="2" placeholder="e.g. मध्य प्रदेश की राजधानी क्या है? / What is the capital of MP?" style="width:100%; padding:10px; border-radius:8px; background:#020617; color:#fff; border:1px solid rgba(56,189,248,0.3); outline: none;"></textarea>
      </div>

      <div class="grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
        <div><label style="color: #cbd5e1; font-size: 12px; margin-bottom: 4px; display: block;">Option A:</label><input type="text" id="q-opt-a" placeholder="Option A" style="width: 100%; padding: 10px; border-radius: 8px; background: #020617; color: #fff; border: 1px solid #475569;"></div>
        <div><label style="color: #cbd5e1; font-size: 12px; margin-bottom: 4px; display: block;">Option B:</label><input type="text" id="q-opt-b" placeholder="Option B" style="width: 100%; padding: 10px; border-radius: 8px; background: #020617; color: #fff; border: 1px solid #475569;"></div>
      </div>

      <div class="grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 12px;">
        <div><label style="color: #cbd5e1; font-size: 12px; margin-bottom: 4px; display: block;">Option C:</label><input type="text" id="q-opt-c" placeholder="Option C" style="width: 100%; padding: 10px; border-radius: 8px; background: #020617; color: #fff; border: 1px solid #475569;"></div>
        <div><label style="color: #cbd5e1; font-size: 12px; margin-bottom: 4px; display: block;">Option D:</label><input type="text" id="q-opt-d" placeholder="Option D" style="width: 100%; padding: 10px; border-radius: 8px; background: #020617; color: #fff; border: 1px solid #475569;"></div>
      </div>

      <div style="margin-top: 15px; max-width: 250px;">
        <label style="color: #cbd5e1; font-weight: 600; font-size: 13px; margin-bottom: 6px; display: block;">Correct Answer Key:</label>
        <select id="q-correct-opt" style="width: 100%; padding: 10px; border-radius: 8px; background: #020617; color: #fff; border: 1px solid #475569;">
          <option value="A">Option A</option>
          <option value="B">Option B</option>
          <option value="C">Option C</option>
          <option value="D">Option D</option>
        </select>
      </div>

      <button type="button" onclick="addNewQuestionToBank()" style="margin-top:20px; padding: 12px 20px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; background: linear-gradient(135deg, #7c3aed 0%, #c084fc 100%); color: #fff;">💾 Save Question to Database</button>
    </div>

    <h4 style="color:#f8fafc; margin-top:30px; margin-bottom: 10px;">Questions in Database (<span id="total-questions-count">0</span>)</h4>
    <div style="overflow-x: auto;">
      <table id="questions-table" style="width: 100%; border-collapse: collapse; font-size: 13px;">
        <thead>
          <tr style="background: #020617; color: #fbbf24; text-align: left;">
            <th style="padding: 10px;">Set / Class</th>
            <th style="padding: 10px;">Subject</th>
            <th style="padding: 10px;">Question</th>
            <th style="padding: 10px;">Options</th>
            <th style="padding: 10px;">Correct Ans</th>
            <th style="padding: 10px;">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="6" style="text-align:center; color:#94a3b8; padding: 15px;">No questions added yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script type="module" src="question.js"></script>
</body>
</html>
