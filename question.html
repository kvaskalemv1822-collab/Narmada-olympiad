<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NVMSO - Question Bank Manager</title>
  <link rel="stylesheet" href="central.css?v=8">
  <link href="https://googleapis.com" rel="stylesheet">
</head>
<body style="background: #0b0f19; padding: 15px; color:#fff;">

<div id="question-main-container" class="container">
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #374151; padding-bottom: 15px; margin-bottom: 20px;">
    <div>
      <h1>📚 Exam Question Bank Manager</h1>
      <div class="director-title">Formulate and Manage Live Competitive Papers</div>
    </div>
    <div>
      <a href="central.html" class="btn-primary" style="text-decoration: none; background: #4b5563; font-size: 13px;">⬅ Back to Control Room</a>
    </div>
  </div>

  <!-- QUESTION MANAGER INPUT VECTOR CONTAINER -->
  <div class="control-box" style="border: 1px solid #c084fc; background: rgba(15, 23, 42, 0.85); padding: 25px; border-radius: 12px;">
    <h3 style="color:#c084fc; margin-bottom: 15px;">✍️ Add New Exam Question Element</h3>
    
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom: 15px;">
      <div>
        <label>Select Target Class Range:</label>
        <select id="q-class-select">
          <option value="3-5">Class 3rd to 5th</option>
          <option value="6-8" selected>Class 6th to 8th</option>
          <option value="9-10">Class 9th to 10th</option>
          <option value="11-12-Maths">Class 11th & 12th (Maths)</option>
          <option value="11-12-Science">Class 11th & 12th (Science)</option>
        </select>
      </div>
      <div>
        <label>Subject Category / Topic:</label>
        <select id="q-subject-select">
          <option value="Maths">Mathematics</option>
          <option value="Science">Science Column</option>
          <option value="GK">General Knowledge / Logic</option>
        </select>
      </div>
    </div>

    <div style="margin-bottom: 15px;">
      <label>Question Statement (Supports Hindi/English Text):</label>
      <textarea id="q-text" rows="4" placeholder="Type or paste the exam question statement here..."></textarea>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom: 15px;">
      <div><label>Option A Input:</label><input type="text" id="q-opt-a" placeholder="Enter option A statement" required></div>
      <div><label>Option B Input:</label><input type="text" id="q-opt-b" placeholder="Enter option B statement" required></div>
      <div><label>Option C Input:</label><input type="text" id="q-opt-c" placeholder="Enter option C statement" required></div>
      <div><label>Option D Input:</label><input type="text" id="q-opt-d" placeholder="Enter option D statement" required></div>
    </div>

    <div style="margin-bottom: 20px; max-width: 250px;">
      <label>Correct Answer Key Matrix:</label>
      <select id="q-correct-opt" style="border-color: #a855f7;">
        <option value="A">Option A</option>
        <option value="B">Option B</option>
        <option value="C">Option C</option>
        <option value="D">Option D</option>
      </select>
    </div>

    <button type="button" class="btn-primary" style="width:100%; background:linear-gradient(135deg, #7c3aed 0%, #c084fc 100%); padding: 14px;" onclick="addNewQuestionToBank()">➕ Save Question to Database Engine</button>
  </div>
</div>

<script src="question.js?v=8"></script>
</body>
</html>
